# =====================================================
# RESHT GOURMET — Docker Compose
# Orquestração completa do ambiente de produção local
# =====================================================

services:
  resht-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resht-gourmet
    image: resht-gourmet:latest
    ports:
      - "80:80"       # Acesso principal: http://localhost
      - "8080:80"     # Porta alternativa: http://localhost:8080
    restart: unless-stopped
    volumes:
      # Volume para logs do Nginx
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.resht.service=web"
      - "com.resht.environment=production"

volumes:
  nginx-logs:
    driver: local

networks:
  default:
    name: resht-network
