# =====================================================
# RESHT GOURMET - Docker Compose
# Orquestracao completa do ambiente de producao local
# =====================================================

services:
  resht-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resht-gourmet
    image: resht-gourmet:latest
    ports:
      - "80:80"       # Acesso principal: http://localhost
      - "8080:80"     # Porta alternativa: http://localhost:8080
    restart: unless-stopped
    volumes:
      # Volume para persistir logs do Nginx
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      # Usa curl (instalado via apk no Dockerfile) para verificar HTTP 200
      test: ["CMD-SHELL", "curl -fs http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.resht.service=web"
      - "com.resht.environment=production"

volumes:
  nginx-logs:
    driver: local

networks:
  default:
    name: resht-network