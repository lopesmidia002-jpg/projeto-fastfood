services:
  resht-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resht-gourmet
    image: resht-gourmet:latest
    ports:
      - "80:80"
      - "8080:80"
    restart: unless-stopped
    volumes:
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.resht.service=web"
      - "com.resht.environment=production"

volumes:
  nginx-logs:
    driver: local

networks:
  default:
    name: resht-network